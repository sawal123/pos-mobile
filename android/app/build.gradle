apply plugin: 'com.android.application'

// ---------------------------------------------------------------------------
// Release signing configuration
//
// Two mutually exclusive credential sources:
//   1. environment: POS_RELEASE_STORE_FILE, POS_RELEASE_STORE_PASSWORD,
//      POS_RELEASE_KEY_ALIAS, POS_RELEASE_KEY_PASSWORD
//   2. android/keystore.properties: storeFile, storePassword, keyAlias, keyPassword
//
// Source selection is ATOMIC. A source is used only as a whole: a partially
// supplied source always fails, even when the other source is complete, and a
// missing key is never filled in from the other source.
//
//   - complete environment      -> environment credentials
//   - complete properties       -> properties credentials
//   - no credentials at all     -> release compiles unsigned (QA artifact only)
//
// storeFile is resolved against the Android root (rootProject.file), never
// against the ambient working directory.
// ---------------------------------------------------------------------------

def releaseSigningKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']

def envReleaseSigning = [
        storeFile    : System.getenv('POS_RELEASE_STORE_FILE'),
        storePassword: System.getenv('POS_RELEASE_STORE_PASSWORD'),
        keyAlias     : System.getenv('POS_RELEASE_KEY_ALIAS'),
        keyPassword  : System.getenv('POS_RELEASE_KEY_PASSWORD'),
]

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def propertyReleaseSigning = [
        storeFile    : keystoreProperties.getProperty('storeFile'),
        storePassword: keystoreProperties.getProperty('storePassword'),
        keyAlias     : keystoreProperties.getProperty('keyAlias'),
        keyPassword  : keystoreProperties.getProperty('keyPassword'),
]

def normalizeSigningValue = { value ->
    (value == null || value.toString().trim().isEmpty()) ? null : value.toString().trim()
}

def normalizedEnvSigning = envReleaseSigning.collectEntries { key, value -> [(key): normalizeSigningValue(value)] }
def normalizedPropertySigning = propertyReleaseSigning.collectEntries { key, value -> [(key): normalizeSigningValue(value)] }

def hasAnyEnvSigning = normalizedEnvSigning.values().any { it != null }
def hasCompleteEnvSigning = normalizedEnvSigning.values().every { it != null }
def hasAnyPropertySigning = normalizedPropertySigning.values().any { it != null }
def hasCompletePropertySigning = normalizedPropertySigning.values().every { it != null }

def incompleteSigningError = { sourceLabel, values ->
    def missingKeys = releaseSigningKeys.findAll { values[it] == null }

    return "Incomplete Android release signing ${sourceLabel} configuration. Missing: ${missingKeys.join(', ')}. " +
            "Credential sources are never mixed and a partial source never falls back to the other source or to an unsigned artifact."
}

// Atomic source selection. A partially supplied environment always fails, even
// when android/keystore.properties is complete.
if (hasAnyEnvSigning && !hasCompleteEnvSigning) {
    throw new GradleException(incompleteSigningError('environment', normalizedEnvSigning))
}

if (!hasAnyEnvSigning && hasAnyPropertySigning && !hasCompletePropertySigning) {
    throw new GradleException(incompleteSigningError('properties', normalizedPropertySigning))
}

def releaseSigningValues = hasCompleteEnvSigning
        ? normalizedEnvSigning
        : (hasCompletePropertySigning ? normalizedPropertySigning : null)

def completeReleaseSigning = releaseSigningValues != null
def releaseKeystoreFile = completeReleaseSigning ? rootProject.file(releaseSigningValues.storeFile) : null

if (completeReleaseSigning && !releaseKeystoreFile.exists()) {
    throw new GradleException(
            "Android release keystore not found at ${releaseKeystoreFile}. " +
                    "Fix storeFile/POS_RELEASE_STORE_FILE, or remove every release signing credential to build an unsigned QA artifact."
    )
}

android {
    namespace = "com.posoffline.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.posoffline.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode policy: major * 10000 + minor * 100 + patch (minor/patch <= 99)
        versionCode 10000
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (completeReleaseSigning) {
        signingConfigs {
            release {
                storeFile releaseKeystoreFile
                storePassword releaseSigningValues.storePassword
                keyAlias releaseSigningValues.keyAlias
                keyPassword releaseSigningValues.keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (completeReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
